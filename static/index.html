<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Hub</title>
<!-- ?v= is a cache-buster: bump it when shipping CSS/JS changes so browsers
     that cached the old URL are forced to fetch the new file. -->
<link rel="stylesheet" href="/static/css/style.css?v=9">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

<!-- Top bar: brand, section switch, search, new-entry button ---------------- -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">CH</span>
    <span class="brand-name">Content Hub</span>
  </div>

  <!-- Every view is one click away from anywhere; keys 1-6 jump too. -->
  <nav class="section-nav">
    <a href="#/library"           class="section-link" data-route="table"     title="Library (1)">Library</a>
    <a href="#/library/deadlines" class="section-link" data-route="deadlines" title="Deadlines (2)">Deadlines</a>
    <a href="#/library/calendar"  class="section-link" data-route="calendar"  title="Calendar (3)">Calendar</a>
    <a href="#/library/month"     class="section-link" data-route="month"     title="This Month (4)">This Month</a>
    <a href="#/library/dashboard" class="section-link" data-route="dashboard" title="Dashboard (5)">Dashboard</a>
    <a href="#/weekly"            class="section-link" data-route="weekly"    title="Weekly (6)">Weekly</a>
    <a href="#/money"             class="section-link" data-route="money"     title="Money (7)">Money</a>
  </nav>

  <div class="topbar-right">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="search" type="search" placeholder="Search topics…" autocomplete="off">
    </div>
    <button id="new-entry" class="btn btn-primary">
      <span aria-hidden="true">+</span> New
    </button>
  </div>
</header>

<!-- Main view target; each view module renders into this ------------------- -->
<main id="view" class="view"></main>

<!-- Footer shows where files are actually being written --------------------- -->
<footer class="footer">
  <span id="footer-media">media: …</span>
  <span id="footer-disk"></span>
</footer>

<!-- Toast notifications ----------------------------------------------------- -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- Reusable confirm dialog ------------------------------------------------- -->
<dialog id="confirm-dialog" class="dialog">
  <h3 id="confirm-title">Are you sure?</h3>
  <p id="confirm-body"></p>
  <div class="dialog-actions">
    <button id="confirm-cancel" class="btn">Cancel</button>
    <button id="confirm-ok" class="btn btn-danger">Delete</button>
  </div>
</dialog>

<!-- No ?v= here: the view modules dynamically import '../app.js', and a
     version query would make the browser load app.js twice as two separate
     modules (double boot, duplicate listeners). Freshness for JS comes from
     the server's Cache-Control: no-cache instead. -->
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
