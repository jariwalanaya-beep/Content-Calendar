<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Hub</title>
<!-- ?v= is a cache-buster: bump it when shipping CSS/JS changes so browsers
     that cached the old URL are forced to fetch the new file. -->
<link rel="stylesheet" href="/static/css/style.css?v=10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

<!-- Sidebar: brand, the two nav groups, and the disk readout ---------------- -->
<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <span class="brand-mark">CH</span>
    <span class="brand-name">Content Hub</span>
  </div>

  <!-- Every view is one click away from anywhere; keys 1-7 jump too. Each
       link carries its own inline SVG so the nav needs no icon font. -->
  <nav class="side-nav">
    <a href="#/library" class="side-link" data-route="table" title="Library (1)">
      <span class="side-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h6v14H4zM14 5h6v14h-6z"></path>
        </svg>
      </span>
      <span>Library</span>
    </a>
    <a href="#/library/deadlines" class="side-link" data-route="deadlines" title="Deadlines (2)">
      <span class="side-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
        </svg>
      </span>
      <span>Deadlines</span>
    </a>
    <a href="#/library/calendar" class="side-link" data-route="calendar" title="Calendar (3)">
      <span class="side-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <path d="M3 10h18M8 3v4M16 3v4"></path>
        </svg>
      </span>
      <span>Calendar</span>
    </a>
    <a href="#/library/month" class="side-link" data-route="month" title="This Month (4)">
      <span class="side-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="2"></rect>
          <path d="M3 9h18"></path><rect x="7" y="13" width="4" height="4"></rect>
        </svg>
      </span>
      <span>This Month</span>
    </a>
    <a href="#/library/dashboard" class="side-link" data-route="dashboard" title="Dashboard (5)">
      <span class="side-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V11M10 19V5M16 19v-6M22 19H2"></path>
        </svg>
      </span>
      <span>Dashboard</span>
    </a>

    <div class="side-section">Planning</div>

    <a href="#/weekly" class="side-link" data-route="weekly" title="Weekly (6)">
      <span class="side-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="2"></rect>
          <path d="M3 9h18M8 13h8M8 17h5"></path>
        </svg>
      </span>
      <span>Weekly</span>
    </a>
    <a href="#/money" class="side-link" data-route="money" title="Money (7)">
      <span class="side-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M8 7h6a3 3 0 010 6H9a3 3 0 000 6h7"></path>
        </svg>
      </span>
      <span>Money</span>
    </a>
  </nav>

  <!-- Where the files actually live, and how much room is left. -->
  <div class="side-card">
    <div class="side-card-label">Storage</div>
    <div id="footer-disk" class="side-card-value"></div>
    <div id="footer-media" class="side-card-sub">media: …</div>
  </div>
</aside>

<!-- Everything right of the sidebar --------------------------------------- -->
<div class="shell">
  <header class="topbar">
    <button class="side-toggle" id="side-toggle" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <!-- Breadcrumb over page title, as in the reference: the crumb says where
         you are in the app, the title says what you are looking at. -->
    <div class="crumbs">
      <div class="crumb-path"><span>Pages</span> / <b id="crumb-here">Library</b></div>
      <div class="crumb-title" id="crumb-title">Library</div>
    </div>

    <div class="topbar-right">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="search" type="search" placeholder="Search topics…" autocomplete="off">
      </div>
      <button id="new-entry" class="btn btn-primary">
        <span aria-hidden="true">+</span> New
      </button>
    </div>
  </header>

  <!-- Main view target; each view module renders into this ------------------ -->
  <main id="view" class="view"></main>
</div>

<!-- Toast notifications ----------------------------------------------------- -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- Reusable confirm dialog ------------------------------------------------- -->
<dialog id="confirm-dialog" class="dialog">
  <h3 id="confirm-title">Are you sure?</h3>
  <p id="confirm-body"></p>
  <div class="dialog-actions">
    <button id="confirm-cancel" class="btn">Cancel</button>
    <button id="confirm-ok" class="btn btn-danger">Delete</button>
  </div>
</dialog>

<!-- No ?v= here: the view modules dynamically import '../app.js', and a
     version query would make the browser load app.js twice as two separate
     modules (double boot, duplicate listeners). Freshness for JS comes from
     the server's Cache-Control: no-cache instead. -->
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
